<button id="themeButton">Тёмная тема</button>
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой To-Do List</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
<h1>📋 Мои задачи</h1>

<div class="input-container">
<input
type="text"
id="taskInput"
placeholder="Введите задачу..."
>

<select id="priorityInput">
    <option value="low">Низкий приоритет</option>
    <option value="medium">Средний приоритет</option>
    <option value="high">Высокий приоритет</option>
</select>

<button id="addButton">Добавить</button>
</div>
<div class="filters">
    <button id="allButton">Все</button>
    <button id="activeButton">Активные</button>
    <button id="completedButton">Выполненные</button>
</div>
<input
    type="text"
    id="searchInput"
    placeholder="Поиск задач..."
>
<div id="taskCounter"></div>
<ul id="taskList"></ul>
</div>

<script src="script.js"></script>

</body>
</html>
